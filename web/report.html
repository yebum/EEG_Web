<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<title>나의 마음 리포트 · NeuroScape</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#0a0d14; --ink:#e9edf4; --ink-2:#aab3c4; --ink-3:#6c7689;
    --line:rgba(255,255,255,.08); --surface:rgba(255,255,255,.04);
    --calm:#7fe0c8; --forest:#86d4a2; --desert:#f2b872; --warn:#f2b872;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:
      radial-gradient(120% 60% at 50% -10%,rgba(127,224,200,.13),transparent 60%),
      radial-gradient(90% 50% at 100% 100%,rgba(143,184,255,.07),transparent 60%),
      var(--bg);
    color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    min-height:100vh;padding:28px 20px calc(44px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;letter-spacing:-.2px}
  .wrap{max-width:440px;margin:0 auto}

  .brand{display:flex;align-items:center;gap:9px}
  .logo{width:28px;height:28px;border-radius:8px;overflow:hidden;background:#11161f;box-shadow:0 0 0 1px var(--line)}
  .logo img{width:100%;height:100%;object-fit:contain}
  .brand b{font-size:14px;font-weight:650}
  .brand time{margin-left:auto;font-size:12px;color:var(--ink-3)}

  .hero{margin-top:34px}
  .eyebrow{font-size:12px;letter-spacing:2.5px;color:var(--calm);font-weight:600}
  h1{font-size:30px;font-weight:700;letter-spacing:-.8px;margin-top:8px;line-height:1.25}
  .place{margin-top:8px;font-size:15px;color:var(--ink-2)}
  .place b{font-weight:650}
  .place b.forest{color:var(--forest)} .place b.desert{color:var(--desert)}

  .scores{display:flex;align-items:flex-end;gap:18px;margin-top:30px}
  .sc span{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:2px}
  .sc b{display:block;font-size:64px;font-weight:600;line-height:1;letter-spacing:-2px;color:var(--ink-3);
    font-variant-numeric:tabular-nums}
  .sc.after b em{font-style:normal;background:linear-gradient(135deg,#bff5e8,var(--calm));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .to{flex:0 0 28px;height:2px;margin-bottom:26px;background:linear-gradient(90deg,transparent,var(--ink-3))}
  .pills{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .pill{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:rgba(127,224,200,.1);color:var(--calm)}
  .pill.down{background:rgba(242,184,114,.12);color:var(--warn)}
  .pill.grade{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}

  .card{margin-top:22px;padding:20px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--line)}
  .card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .card-h b{font-size:15px;font-weight:650}
  .card-h span{font-size:12px;color:var(--ink-3)}
  canvas{width:100%;height:150px;display:block}
  .axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:8px}

  .msg{margin-top:22px;padding:22px 20px;border-radius:22px;background:rgba(127,224,200,.06);
    border:1px solid rgba(127,224,200,.16);font-size:16.5px;line-height:1.75;color:#dfe9e6}
  .msg::before{content:"";display:block;width:22px;height:2px;background:var(--calm);border-radius:2px;margin-bottom:12px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .m{padding:15px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
  .m span{display:block;font-size:12px;color:var(--ink-3)}
  .m b{display:block;font-size:19px;font-weight:650;margin-top:6px;font-variant-numeric:tabular-nums}
  .m b.good{color:var(--calm)} .m b.warn{color:var(--warn)}
  .m small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px}

  .about{margin-top:22px;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
  .about b{color:var(--ink);font-weight:600}
  .foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.7;color:var(--ink-3)}
  .err{margin-top:60px;text-align:center;color:var(--ink-2);line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo"><img src="logo.png" alt="" onerror="this.remove()"></div>
    <b>NeuroScape</b>
    <time id="ts"></time>
  </div>

  <div id="content">
    <section class="hero">
      <div class="eyebrow">MIND REPORT</div>
      <h1>오늘의 마음 여정</h1>
      <p class="place" id="place"></p>

      <div class="scores">
        <div class="sc"><span>체험 전</span><b id="preScore">–</b></div>
        <div class="to"></div>
        <div class="sc after"><span>체험 후</span><b><em id="postScore">–</em></b></div>
      </div>
      <div class="pills">
        <span class="pill" id="delta">–</span>
        <span class="pill grade" id="grade">–</span>
      </div>
    </section>

    <p class="msg" id="msg">—</p>

    <section class="card">
      <div class="card-h"><b>마음의 흐름</b><span>높을수록 고요함</span></div>
      <canvas id="spark"></canvas>
      <div class="axis"><span>체험 시작</span><span>체험 끝</span></div>
    </section>

    <section class="card">
      <div class="card-h"><b>자세히 보기</b></div>
      <div class="grid">
        <div class="m"><span>긴장 감소</span><b id="reduce">–</b><small>체험 전 대비</small></div>
        <div class="m"><span>마음의 흔들림</span><b id="vary">–</b><small>체험 중 변화 폭</small></div>
        <div class="m"><span>가장 고요했던 순간</span><b class="good" id="calmest">–</b><small>최고 안정 점수</small></div>
        <div class="m"><span>가장 긴장했던 순간</span><b class="warn" id="peak">–</b><small>최저 안정 점수</small></div>
        <div class="m"><span>월드에 머문 시간</span><b id="calmT">–</b><small id="calmedTxt"></small></div>
        <div class="m"><span>전체 체험 시간</span><b id="sessT">–</b><small>인트로부터 마무리까지</small></div>
      </div>
    </section>

    <p class="about" id="about"></p>

    <div class="foot">
      이 리포트는 이마의 두 전극으로 측정한 뇌파의 크기(진폭)로 안정 정도를 계산한 참고 자료예요.
      의료 기기나 진단이 아니에요.<br>NeuroScape · EEG Meditation
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const sc = a => Math.max(0, Math.min(100, Math.round(100 - a * 2.5)));
const fmt = s => { s = Math.max(0, s | 0); const m = s / 60 | 0, r = s % 60; return m ? `${m}분 ${r}초` : `${r}초`; };

function drawSpark(journey, preScore) {
  const cv = $('spark'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const padT = 10, padB = 8, padX = 6;
  const s = journey.map(sc);
  const lo = Math.max(0, Math.min(...s, preScore) - 10), hi = Math.min(100, Math.max(...s, preScore) + 6);
  const yf = v => (H - padB) - (v - lo) / Math.max(1, hi - lo) * (H - padT - padB);
  ctx.strokeStyle = 'rgba(170,179,196,.35)'; ctx.setLineDash([3, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padX, yf(preScore)); ctx.lineTo(W - padX, yf(preScore)); ctx.stroke(); ctx.setLineDash([]);
  if (s.length < 2) return;
  const sm = s.map((v, i) => (s[Math.max(0, i - 1)] + v * 2 + s[Math.min(s.length - 1, i + 1)]) / 4);
  const n = sm.length, xf = i => padX + i / (n - 1) * (W - padX * 2);
  const pts = sm.map((v, i) => [xf(i), yf(v)]);
  const path = () => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 0; i < n - 1; i++) { const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]); } };
  path(); ctx.lineTo(pts[n - 1][0], H); ctx.lineTo(pts[0][0], H); ctx.closePath();
  const fg = ctx.createLinearGradient(0, 0, 0, H);
  fg.addColorStop(0, 'rgba(127,224,200,.22)'); fg.addColorStop(1, 'rgba(127,224,200,0)');
  ctx.fillStyle = fg; ctx.fill();
  const lg = ctx.createLinearGradient(0, 0, W, 0);
  lg.addColorStop(0, '#8fb8ff'); lg.addColorStop(1, '#7fe0c8');
  ctx.strokeStyle = lg; ctx.lineWidth = 2.4; ctx.lineJoin = 'round'; path(); ctx.stroke();
  const L = pts[n - 1];
  ctx.fillStyle = '#0a0d14'; ctx.beginPath(); ctx.arc(L[0], L[1], 5.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#7fe0c8'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(L[0], L[1], 4.5, 0, 7); ctx.stroke();
}

try {
  const q = new URLSearchParams(location.search).get('d');
  const r = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, '+').replace(/_/g, '/')))));
  $('ts').textContent = (r.ts || '').replace(/-/g, '.');
  $('preScore').textContent = r.preScore;
  $('postScore').textContent = r.postScore;

  const up = r.delta >= 0;
  $('delta').textContent = up ? `안정 +${r.delta}` : `안정 ${r.delta}`;
  $('delta').className = 'pill' + (up ? '' : ' down');
  const ps = r.postScore;
  $('grade').textContent = ps >= 85 ? '깊은 고요' : ps >= 70 ? '안정' : ps >= 50 ? '보통' : '각성';

  const W = { forest: ['숲', 'forest', '마음이 흔들릴 때 찾아가는 숲이에요. 빛과 나무 사이에서 <b>지금 이 순간</b>에 머무르도록 돕는 공간이에요.'],
              desert: ['사막', 'desert', '긴장이 높을 때 찾아가는 밤의 사막이에요. 넓은 하늘 아래에서 <b>숨을 길게 고르도록</b> 돕는 공간이에요.'] }[r.world];
  $('place').innerHTML = W ? `당신이 머문 곳 · <b class="${W[1]}">${W[0]}</b>` : '';
  $('about').innerHTML = W ? W[2] + ' 체험 중 뇌파가 흔들리면 빛의 입자도 함께 흔들렸어요.' : '';

  const j = (r.journey && r.journey.length) ? r.journey : [r.pre, r.post];
  drawSpark(j, r.preScore);
  window.addEventListener('resize', () => drawSpark(j, r.preScore));

  const reduce = r.pre > 0 ? Math.round((r.pre - r.post) / r.pre * 100) : 0;
  $('reduce').textContent = (reduce >= 0 ? '−' : '+') + Math.abs(reduce) + '%';
  $('reduce').className = reduce >= 0 ? 'good' : 'warn';
  $('calmest').textContent = sc(Math.min(...j)) + '점';
  $('peak').textContent = sc(Math.max(...j)) + '점';
  const mean = j.reduce((a, b) => a + b, 0) / j.length;
  const sd = Math.sqrt(j.reduce((a, b) => a + (b - mean) * (b - mean), 0) / j.length);
  $('vary').textContent = sd < 3 ? '잔잔함' : sd < 6 ? '보통' : '많이 흔들림';
  $('vary').className = sd < 3 ? 'good' : (sd < 6 ? '' : 'warn');
  $('calmT').textContent = fmt(r.calmSec);
  $('calmedTxt').textContent = r.calmed ? '스스로 고요에 도달' : '시간 안에 마무리';
  $('sessT').textContent = fmt(r.sessionSec);

  let msg;
  if (r.calmed && r.delta >= 15) msg = '스스로 깊은 고요에 도달했어요. 마음이 한결 가벼워진 하루예요.';
  else if (r.delta >= 15) msg = '마음이 크게 가라앉았어요. 몸과 호흡이 잘 따라와 주었어요.';
  else if (r.delta >= 5) msg = '천천히, 그러나 분명하게 마음이 안정되었어요.';
  else if (r.delta >= -4) msg = '마음이 잔잔하게 머물렀어요. 지금 이 순간으로 충분해요.';
  else msg = '오늘은 마음이 조금 일렁였어요. 그것도 괜찮아요. 다음 호흡에 다시 머물러 보세요.';
  $('msg').textContent = msg;
} catch (e) {
  $('content').innerHTML = '<p class="err">리포트 정보를 찾지 못했어요.<br>체험 후 받은 QR 코드로 다시 열어 주세요.</p>';
}
</script>
</body>
</html>
